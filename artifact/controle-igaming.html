    main.querySelectorAll('[data-dep]').forEach((b) => b.addEventListener('click', () => openQuickDeposito(inf, db.lancamentos.find((l) => l.id === +b.dataset.dep))));
    main.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => openLancForm(inf, db.lancamentos.find((l) => l.id === +b.dataset.edit))));
    main.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => {
      const l = db.lancamentos.find((x) => x.id === +b.dataset.del);
      openConfirm('Excluir lançamento?', `Lançamento de ${fmtData(l.data)} será removido permanentemente.`, 'Excluir', () => {
        db.lancamentos = db.lancamentos.filter((x) => x.id !== l.id); save(); closeModal(); viewDetalhe(main, id);
      });
    }));
  }

  /* ============================================================
     VIEW: Ranking
  ============================================================ */
  let rankCrit = 'lucro';
  const CRIT = {
    lucro: { label: 'Lucro total', get: (m) => m.lucro, fmt: fmtBRL, desc: true },
    roi: { label: 'ROI', get: (m) => m.roi, fmt: fmtPct, desc: true },
    custoCadastro: { label: 'Menor custo/cadastro', get: (m) => m.custoPorCadastro, fmt: (v) => (v != null ? fmtBRL(v) : '—'), desc: false },
    custoStory: { label: 'Menor custo/story', get: (m) => m.custoMedioPorStory, fmt: (v) => (v != null ? fmtBRL(v) : '—'), desc: false, soStories: true },
  };
  function viewRanking(main) {
    let lista = db.influenciadores.map((inf) => ({ inf, m: metricas(lancsDe(inf.id)) })).filter((x) => x.m.qtdLancamentos > 0);
    const c = CRIT[rankCrit];
    if (c.soStories) lista = lista.filter((x) => x.inf.modeloPagamento === 'stories');
    lista.sort((a, b) => {
      const va = c.get(a.m), vb = c.get(b.m);
      if (va == null && vb == null) return 0;
      if (va == null) return 1; if (vb == null) return -1;
      return c.desc ? vb - va : va - vb;
    });
    const top3 = lista.slice(0, 3), resto = lista.slice(3);
    const POD = [{ ico: 'crown', cls: 'g1', lbl: '1º' }, { ico: 'medal', cls: 'g2', lbl: '2º' }, { ico: 'award', cls: 'g3', lbl: '3º' }];
    const critBtns = Object.entries(CRIT).map(([k, v]) => `<button data-crit="${k}" class="${rankCrit === k ? 'active' : ''}">${v.label}</button>`).join('');

    main.innerHTML = `<div class="view">
      ${head('Ranking', 'Compare o desempenho das parcerias por diferentes critérios', `<div class="segmented" id="crit">${critBtns}</div>`)}
      ${lista.length === 0 ? `<div class="card">${emptyState('trophy', 'Sem dados para o ranking', 'Registre lançamentos para que os influenciadores apareçam aqui.')}</div>`
        : `<div class="grid podium">${top3.map((x, i) => {
            const p = POD[i]; const val = c.get(x.m);
            const neg = rankCrit === 'lucro' && x.m.lucro < 0;
            return `<div class="card pod" data-go="influenciadores/${x.inf.id}" ${i === 0 ? 'style="transform:translateY(-6px)"' : ''}>
              <div class="medal ${p.cls}">${svg(p.ico)}</div><div class="place ${p.cls}">${p.lbl} lugar</div>
              <div class="pod-name">${esc(x.inf.nome)}</div><div class="muted" style="font-size:12px">${esc(x.inf.instagram || 'sem @')}</div>
              <div class="pod-val tnum ${rankCrit === 'lucro' ? (neg ? 'neg' : 'pos') : ''}">${c.fmt(val)}</div>
              <div style="margin-top:8px">${modBadge(x.inf.modeloPagamento)}</div></div>`;
          }).join('')}</div>
          ${resto.length ? `<div class="card" style="margin-top:16px"><div class="tbl-wrap"><table><thead><tr><th>#</th><th>Influenciador</th><th>Modelo</th><th class="ta-r">Lucro</th><th class="ta-r">ROI</th><th class="ta-r">${c.label}</th></tr></thead><tbody>${resto.map((x, i) => `
            <tr data-go="influenciadores/${x.inf.id}" style="cursor:pointer"><td style="font-weight:700" class="muted">${i + 4}</td>
              <td><div style="font-weight:600">${esc(x.inf.nome)}</div><div class="muted" style="font-size:12px">${esc(x.inf.instagram || 'sem @')}</div></td>
              <td>${modBadge(x.inf.modeloPagamento)}</td>
              <td class="ta-r tnum ${x.m.lucro < 0 ? 'neg' : 'pos'}" style="font-weight:600">${fmtBRL(x.m.lucro)}</td>
              <td class="ta-r tnum muted">${fmtPct(x.m.roi)}</td>
              <td class="ta-r tnum" style="font-weight:700">${c.fmt(c.get(x.m))}</td></tr>`).join('')}</tbody></table></div></div>` : ''}`}
    </div>`;

    document.getElementById('crit').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { rankCrit = b.dataset.crit; viewRanking(main); } });
    main.querySelectorAll('[data-go]').forEach((el) => el.addEventListener('click', () => go(el.dataset.go)));
  }

  /* ============================================================
     VIEW: Configurações
  ============================================================ */
  function viewConfig(main) {
    const c = db.config;
    const hist = [...db.configHistorico].sort((a, b) => b.alteradoEm.localeCompare(a.alteradoEm));
    main.innerHTML = `<div class="view">
      ${head('Configurações', 'Parâmetros globais da agência', `<span data-sync class="sync-tag ${SYNC.on ? 'ok' : 'warn2'}">${SYNC.on ? svg('check') + ' Sincronizado com sua conta' : svg('info') + ' Salvando só neste navegador'}</span>`)}
      <div class="grid" style="grid-template-columns:1fr 1fr" id="cfgRow">
        <div class="card"><div class="card-head"><h3>${svg('percent')} Sua participação global</h3><p>Percentual da receita bruta que fica com a agência (o restante é do dono da plataforma).</p></div>
          <div class="card-pad" style="display:flex;flex-direction:column;gap:14px">
            <div class="field"><label>Participação da agência (%)</label>
              <div style="display:flex;gap:10px;align-items:center">
                <input type="number" min="0" max="100" step="0.1" id="cfgVal" class="input" style="font-size:17px;font-weight:700" value="${c.minhaParticipacao}">
                <button class="btn" id="cfgSave">${svg('save')}Salvar</button>
              </div>
            </div>
            <div class="hint-box s" style="display:flex;gap:10px"><span style="color:var(--sky)">${svg('info')}</span><span>Alterar este valor <b style="color:var(--text)">não recalcula</b> lançamentos antigos. Cada lançamento guarda o percentual vigente no momento em que foi criado (snapshot histórico).</span></div>
            <div id="cfgMsg"></div>
            <p class="muted" style="font-size:12px">Atual: <b style="color:var(--text)">${fmtPct(c.minhaParticipacao)}</b> · atualizado em ${fmtData(c.atualizadoEm)}</p>
          </div>
        </div>
        <div class="card"><div class="card-head"><h3>${svg('history')} Histórico de alterações</h3><p>Registro das mudanças no percentual da agência</p></div>
          <div class="card-pad">${hist.length ? `<div class="timeline">${hist.map((h) => `<div class="tl-item"><div class="tl-row"><div class="chips">${h.valorAnterior != null ? `<span class="strike">${fmtPct(h.valorAnterior)}</span>` : ''}<span style="color:var(--accent);font-weight:700">→ ${fmtPct(h.minhaParticipacao)}</span></div><span class="muted" style="font-size:12px">${fmtData(h.alteradoEm)}</span></div></div>`).join('')}</div>`
            : emptyState('history', 'Sem alterações', 'As mudanças no percentual aparecerão aqui.')}</div>
        </div>
      </div>

      <div class="card" style="margin-top:16px"><div class="card-head"><h3>${svg('coins')} Valores rápidos de depósito</h3><p>Os botões que aparecem ao lançar depósitos. Deixe só os valores que você mais usa.</p></div>
        <div class="card-pad" style="display:flex;flex-direction:column;gap:14px">
          <div class="chip-adds" id="presetChips">${presetsDep().map((v, i) => `<span class="dep-chip">R$ ${v}<button type="button" class="preset-rm" data-i="${i}" aria-label="remover">${svg('close')}</button></span>`).join('')}</div>
          <div class="field" style="max-width:320px"><label>Adicionar um valor (R$)</label><div style="display:flex;gap:8px"><input type="number" min="0" step="1" id="presetNew" class="input" placeholder="Ex: 200"><button class="btn soft" id="presetAdd">${svg('plus')}Adicionar</button></div></div>
          <div id="presetMsg"></div>
        </div>
      </div>

      <div class="card" style="margin-top:16px"><div class="card-head"><h3>${svg('save')} Backup dos dados</h3><p>${SYNC.on ? 'Seus dados já ficam salvos na sua conta e sincronizam entre dispositivos. Ainda assim, dá pra guardar uma cópia.' : 'Guarde uma cópia dos seus dados para não perder nada (útil ao trocar de navegador ou dispositivo).'}</p></div>
        <div class="card-pad" style="display:flex;flex-direction:column;gap:14px">
          <div style="display:flex;flex-wrap:wrap;gap:10px">
            <button class="btn soft" id="btnExport">${svg('save')} Exportar (copiar)</button>
            <button class="btn ghost" id="btnImport">${svg('history')} Restaurar de um backup</button>
          </div>
          <textarea class="textarea" id="backupBox" placeholder="A cópia dos seus dados aparece aqui ao exportar. Para restaurar, cole aqui um backup e clique em Restaurar." style="min-height:96px;font-family:ui-monospace,monospace;font-size:12px"></textarea>
          <div id="backupMsg"></div>
          <p class="muted" style="font-size:12px">Exportar copia todos os dados para a área de transferência (e mostra na caixa acima). Restaurar substitui os dados atuais pelo backup colado.</p>
        </div>
      </div>
    </div>`;
    const row = document.getElementById('cfgRow');
    if (row && window.innerWidth < 720) row.style.gridTemplateColumns = '1fr';

    const addPreset = () => {
      const inp = document.getElementById('presetNew');
      const msg = document.getElementById('presetMsg');
      const v = Math.round(Number(inp.value));
      if (!v || v <= 0) { msg.innerHTML = `<div class="form-err">Informe um valor maior que zero.</div>`; return; }
      const atual = presetsDep();
      if (atual.includes(v)) { msg.innerHTML = `<div class="form-err">Esse valor já está na lista.</div>`; return; }
      if (atual.length >= 12) { msg.innerHTML = `<div class="form-err">Máximo de 12 valores.</div>`; return; }
      db.presetsDeposito = [...atual, v].sort((a, b) => a - b);
      save(); viewConfig(main);
    };
    document.querySelectorAll('.preset-rm').forEach((b) => b.addEventListener('click', () => {
      const atual = presetsDep();
      if (atual.length <= 1) { document.getElementById('presetMsg').innerHTML = `<div class="form-err">Deixe ao menos um valor.</div>`; return; }
      db.presetsDeposito = atual.filter((_, i) => i !== +b.dataset.i);
      save(); viewConfig(main);
    }));
    document.getElementById('presetAdd').addEventListener('click', addPreset);
    document.getElementById('presetNew').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addPreset(); } });

    document.getElementById('btnExport').addEventListener('click', async () => {
      const json = JSON.stringify(db);
      const box = document.getElementById('backupBox');
      box.value = json;
      box.focus(); box.select();
      let copiado = false;
      try { await navigator.clipboard.writeText(json); copiado = true; } catch (e) {
        try { document.execCommand('copy'); copiado = true; } catch (e2) {}
      }
      document.getElementById('backupMsg').innerHTML = `<div class="form-ok">${svg('check')}${copiado ? 'Backup copiado para a área de transferência.' : 'Backup gerado na caixa acima — selecione e copie (Ctrl+C).'}</div>`;
    });
    document.getElementById('btnImport').addEventListener('click', () => {
      const txt = document.getElementById('backupBox').value.trim();
      const msg = document.getElementById('backupMsg');
      if (!txt) { msg.innerHTML = `<div class="form-err">Cole um backup na caixa acima antes de restaurar.</div>`; return; }
      let novo;
      try { novo = JSON.parse(txt); } catch (e) { msg.innerHTML = `<div class="form-err">Backup inválido (não é um JSON válido).</div>`; return; }
      if (!novo || !Array.isArray(novo.influenciadores) || !Array.isArray(novo.lancamentos) || !novo.config) {
        msg.innerHTML = `<div class="form-err">Esse texto não parece ser um backup do Controle iGaming.</div>`; return;
      }
      openConfirm('Restaurar backup?', 'Os dados atuais serão substituídos pelos dados do backup. Isso vale também para a versão salva na sua conta.', 'Restaurar', () => {
        db = novo;
        db.exemplo = false;
        if (db.seq == null) db.seq = 1 + Math.max(0, ...db.influenciadores.map((x) => x.id || 0), ...db.lancamentos.map((x) => x.id || 0));
        normalize();
        save();
        closeModal();
        viewConfig(main);
      });
    });
    document.getElementById('cfgSave').addEventListener('click', () => {
      const n = Number(document.getElementById('cfgVal').value);
      const msg = document.getElementById('cfgMsg');
      if (isNaN(n) || n < 0 || n > 100) { msg.innerHTML = `<div class="form-err">Informe um valor entre 0 e 100.</div>`; return; }
      if (n === c.minhaParticipacao) { msg.innerHTML = `<div class="form-err">O valor é o mesmo já configurado.</div>`; return; }
      const now = new Date().toISOString();
      db.configHistorico.push({ id: db.seq++, minhaParticipacao: n, valorAnterior: c.minhaParticipacao, alteradoEm: now });
      db.config = { minhaParticipacao: n, atualizadoEm: now };
      save(); viewConfig(main);
      const m2 = document.getElementById('cfgMsg');
      m2.innerHTML = `<div class="form-ok">${svg('check')}Participação atualizada com sucesso.</div>`;
      setTimeout(() => { const e = document.getElementById('cfgMsg'); if (e) e.innerHTML = ''; }, 2500);
    });
  }

  /* ============================================================
     MODAIS
  ============================================================ */
  const modalRoot = document.getElementById('modalRoot');
  function closeModal() {
    modalRoot.innerHTML = '';
    document.body.style.overflow = '';
    if (remoteStash) { const r = remoteStash; remoteStash = null; adotarRemoto(r); }
  }
  function openModal(html, sm) {
    modalRoot.innerHTML = `<div class="modal-back" id="mBack"><div class="modal ${sm ? 'sm' : ''}">${html}</div></div>`;
    document.body.style.overflow = 'hidden';
    document.getElementById('mBack').addEventListener('mousedown', (e) => { if (e.target.id === 'mBack') closeModal(); });
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  function openConfirm(title, desc, confirmLabel, onConfirm) {
    openModal(`<div class="modal-body" style="padding-top:26px">
      <div style="width:44px;height:44px;border-radius:999px;background:var(--danger-soft);color:var(--danger);display:grid;place-items:center">${svg('alert')}</div>
      <h2 style="font-size:18px">${title}</h2><p class="muted" style="margin:-6px 0 0;font-size:13.5px">${desc}</p>
    </div><div class="modal-foot"><button class="btn ghost" id="cCancel">Cancelar</button><button class="btn danger" id="cOk">${confirmLabel}</button></div>`, true);
    document.getElementById('cCancel').addEventListener('click', closeModal);
    document.getElementById('cOk').addEventListener('click', onConfirm);
  }

  /* ---- Form Influenciador ---- */
  const MODELOS_INFO = [
    { v: 'stories', ico: 'film', t: 'Stories', d: 'Valor por post' },
    { v: 'fixo', ico: 'wallet', t: 'Fixo', d: 'Valor recorrente' },
    { v: 'percentual', ico: 'percent', t: 'Percentual', d: '% dos depósitos' },
  ];
  function openInfForm(inf) {
    const ed = !!inf;
    const f = ed
      ? { valorPorStory: '', qtdStoriesPadrao: '', diasDivulgacao: '', percentualComissao: '', valorFixo: '', recorrencia: 'mensal', ...inf }
      : { nome: '', instagram: '', status: 'negociando', dataInicio: '', modeloPagamento: 'stories', percentualComissao: '', valorFixo: '', recorrencia: 'mensal', valorPorStory: '', qtdStoriesPadrao: '', diasDivulgacao: '', observacoes: '' };

    const render = () => {
      const deal = f.modeloPagamento === 'percentual'
        ? `<div class="deal-grid"><div class="field"><label>Comissão sobre depósitos (%)</label><input type="number" min="0" step="0.1" id="iPct" class="input" value="${f.percentualComissao ?? ''}" placeholder="Ex: 50"></div></div>
           <p class="muted" style="font-size:12px;margin:10px 0 0">Ela recebe esse % sobre a soma dos depósitos gerados em cada lançamento.</p>`
        : f.modeloPagamento === 'fixo'
        ? `<div class="deal-grid"><div class="field"><label>Valor fixo (R$)</label><input type="number" min="0" step="0.01" id="iFixo" class="input" value="${f.valorFixo ?? ''}" placeholder="Ex: 1500"></div><div class="field"><label>Recorrência</label><select class="select" id="iRec">${opt(['mensal', 'quinzenal', 'semanal'], f.recorrencia || 'mensal', { mensal: 'Mensal', quinzenal: 'Quinzenal', semanal: 'Semanal' })}</select></div></div>
           <p class="muted" style="font-size:12px;margin:10px 0 0">Já entra como valor pago em cada lançamento (editável em reajustes pontuais).</p>`
        : `<div class="deal-grid"><div class="field"><label>Valor por story (R$)</label><input type="number" min="0" step="0.01" id="iVStory" class="input" value="${f.valorPorStory ?? ''}" placeholder="Ex: 250"></div><div class="field"><label>Qtd. de stories</label><input type="number" min="0" id="iQStory" class="input" value="${f.qtdStoriesPadrao ?? ''}" placeholder="Ex: 3"></div><div class="field"><label>Dias de divulgação</label><input type="number" min="0" id="iDias" class="input" value="${f.diasDivulgacao ?? ''}" placeholder="Ex: 7"></div></div>
           <p class="muted" style="font-size:12px;margin:10px 0 0">Vira o padrão dos lançamentos — dá pra ajustar em cada post.</p>`;

      const cards = MODELOS_INFO.map((m) => `<button type="button" class="model-opt ${f.modeloPagamento === m.v ? 'active' : ''}" data-mod="${m.v}"><span class="mo-ico">${svg(m.ico)}</span><div class="mo-t">${m.t}</div><div class="mo-d">${m.d}</div></button>`).join('');
      const pills = ['negociando', 'fechado', 'pausado'].map((s) => `<button type="button" class="pill ${f.status === s ? 'active' : ''}" data-status="${s}">${STATUS_LBL[s]}</button>`).join('');

      return `<div class="modal-head"><h2>${ed ? 'Editar influenciador' : 'Novo influenciador'}</h2><p>${ed ? 'Atualize os dados e o combinado da parceria.' : 'Só o nome é obrigatório — o resto você ajusta quando quiser.'}</p><button class="icon-btn modal-x" id="mX">${svg('close')}</button></div>
      <div class="modal-body">
        <div class="form-row c2"><div class="field"><label>Nome *</label><input class="input" id="iNome" value="${esc(f.nome)}" placeholder="Ex: Ana Souza"></div><div class="field"><label>@ do Instagram</label><input class="input" id="iInsta" value="${esc(f.instagram || '')}" placeholder="@anasouza"></div></div>
        <div class="field"><label>Como você paga essa parceria?</label><div class="model-pick" id="iModPick">${cards}</div></div>
        <div class="box" id="dealBox">${deal}</div>
        <div class="form-row c2">
          <div class="field"><label>Status</label><div class="pill-group" id="iStatusPills">${pills}</div></div>
          <div class="field"><label>Início da parceria</label><input type="date" class="input" id="iData" value="${f.dataInicio || ''}"></div>
        </div>
        <div class="field"><label>Observações <span class="muted" style="font-weight:400">(opcional)</span></label><textarea class="textarea" id="iObs" placeholder="Notas sobre a parceria, condições, contatos…">${esc(f.observacoes || '')}</textarea></div>
        <div id="iErr"></div>
      </div>
      <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn" id="mSave">${ed ? 'Salvar alterações' : 'Cadastrar influenciador'}</button></div>`;
    };

    const readInto = () => {
      const g = (id) => { const e = document.getElementById(id); return e ? e.value : undefined; };
      f.nome = g('iNome'); f.instagram = g('iInsta'); f.dataInicio = g('iData'); f.observacoes = g('iObs');
      if (g('iPct') !== undefined) f.percentualComissao = g('iPct');
      if (g('iFixo') !== undefined) f.valorFixo = g('iFixo');
      if (g('iRec') !== undefined) f.recorrencia = g('iRec');
      if (g('iVStory') !== undefined) f.valorPorStory = g('iVStory');
      if (g('iQStory') !== undefined) f.qtdStoriesPadrao = g('iQStory');
      if (g('iDias') !== undefined) f.diasDivulgacao = g('iDias');
    };
    const rerender = () => { readInto(); modalRoot.querySelector('.modal').innerHTML = render(); wire(); };
    const wire = () => {
      document.getElementById('mX').addEventListener('click', closeModal);
      document.getElementById('mCancel').addEventListener('click', closeModal);
      document.getElementById('mSave').addEventListener('click', salvar);
      modalRoot.querySelectorAll('#iModPick .model-opt').forEach((b) => b.addEventListener('click', () => { if (b.dataset.mod !== f.modeloPagamento) { f.modeloPagamento = b.dataset.mod; rerender(); } }));
      modalRoot.querySelectorAll('#iStatusPills .pill').forEach((b) => b.addEventListener('click', () => {
        f.status = b.dataset.status;
        modalRoot.querySelectorAll('#iStatusPills .pill').forEach((p) => p.classList.toggle('active', p === b));
      }));
    };
    const nOrNull = (v) => (v === '' || v == null ? null : Math.max(0, Number(v) || 0));
    const salvar = () => {
      readInto();
      const err = document.getElementById('iErr');
      if (!f.nome.trim()) { err.innerHTML = `<div class="form-err">O nome é obrigatório.</div>`; return; }
      const rec = {
        nome: f.nome.trim(), instagram: (f.instagram || '').trim() || null, status: f.status, dataInicio: f.dataInicio || null,
        modeloPagamento: f.modeloPagamento, observacoes: (f.observacoes || '').trim() || null,
        percentualComissao: f.modeloPagamento === 'percentual' ? nOrNull(f.percentualComissao) : null,
        valorFixo: f.modeloPagamento === 'fixo' ? nOrNull(f.valorFixo) : null,
        recorrencia: f.modeloPagamento === 'fixo' ? (f.recorrencia || 'mensal') : null,
        valorPorStory: f.modeloPagamento === 'stories' ? nOrNull(f.valorPorStory) : null,
        qtdStoriesPadrao: f.modeloPagamento === 'stories' ? nOrNull(f.qtdStoriesPadrao) : null,
        diasDivulgacao: f.modeloPagamento === 'stories' ? nOrNull(f.diasDivulgacao) : null,
      };
      if (ed) { Object.assign(inf, rec); } else { db.influenciadores.push({ id: db.seq++, criadoEm: new Date().toISOString(), ...rec }); }
      save(); closeModal(); router();
    };
    openModal(render());
    wire();
    setTimeout(() => { const n = document.getElementById('iNome'); if (n) n.focus(); }, 30);
  }

  /* ---- Form Lançamento ---- */
  function openLancForm(inf, lanc) {
    const ed = !!lanc;
    const modelo = inf.modeloPagamento;
    const f = ed
      ? { data: lanc.data, cadastros: String(lanc.cadastros ?? ''), depositos: (lanc.depositos || []).map(String), receitaBruta: String(lanc.receitaBruta ?? ''), receitaBrutaManual: !!lanc.receitaBrutaManual || (lanc.receitaBruta != null && Math.abs((lanc.receitaBruta || 0) - somaDep(lanc.depositos)) > 0.01), percentualAplicado: String(lanc.percentualAplicado ?? ''), gastosExtras: String(lanc.gastosExtras ?? ''), observacoes: lanc.observacoes || '', quantidadeStories: lanc.quantidadeStories != null ? String(lanc.quantidadeStories) : '', valorCobrado: lanc.valorCobrado != null ? String(lanc.valorCobrado) : '', valorPago: lanc.valorPago != null ? String(lanc.valorPago) : '' }
      : { data: hojeISO(), cadastros: '', depositos: [], receitaBruta: '', receitaBrutaManual: false, percentualAplicado: String(db.config.minhaParticipacao), gastosExtras: '', observacoes: '',
          quantidadeStories: modelo === 'stories' && inf.qtdStoriesPadrao != null ? String(inf.qtdStoriesPadrao) : '',
          valorCobrado: modelo === 'stories' && inf.valorPorStory != null ? String(round2(inf.valorPorStory * (inf.qtdStoriesPadrao != null ? inf.qtdStoriesPadrao : 1))) : '',
          valorPago: modelo === 'fixo' && inf.valorFixo != null ? String(inf.valorFixo) : '' };
    const num = (v) => (v === '' || v == null ? 0 : Number(v) || 0);
    // Receita bruta acompanha a soma dos depósitos, a menos que editada à mão.
    const somaDepF = () => round2(f.depositos.reduce((a, v) => a + num(v), 0));
    const syncReceita = () => {
      if (!f.receitaBrutaManual) {
        f.receitaBruta = String(somaDepF());
        const e = document.getElementById('lBruta');
        if (e) e.value = f.receitaBruta;
      }
    };
    const hojeLanc = !ed ? db.lancamentos.find((l) => l.influenciadorId === inf.id && l.data === hojeISO()) : null;

    const preview = () => {
      const totalDep = f.depositos.reduce((a, v) => a + num(v), 0);
      const recLiq = (num(f.receitaBruta) * num(f.percentualAplicado)) / 100;
      let pago = 0;
      if (modelo === 'stories') pago = num(f.valorCobrado);
      else if (modelo === 'fixo') pago = num(f.valorPago);
      else pago = f.valorPago !== '' ? num(f.valorPago) : (totalDep * num(inf.percentualComissao)) / 100;
      const lucro = recLiq - pago - num(f.gastosExtras);
      const cps = modelo === 'stories' && num(f.quantidadeStories) > 0 ? num(f.valorCobrado) / num(f.quantidadeStories) : null;
      return { totalDep, recLiq, lucro, cps };
    };

    const render = () => {
      const p = preview();
      const espec = modelo === 'stories'
        ? `<div class="hint-box f"><div class="form-row c3"><div class="field"><label>Qtd. de stories</label><input type="number" min="0" id="lQtd" class="input" value="${f.quantidadeStories}" placeholder="Ex: 3"></div><div class="field"><label>Valor cobrado (R$)</label><input type="number" min="0" step="0.01" id="lCob" class="input" value="${f.valorCobrado}" placeholder="Ex: 250"></div><div class="field"><label>Custo por story</label><div class="readonly-val" id="lCps" style="color:#d946ef">${p.cps != null ? fmtBRL(p.cps) : '—'}</div></div></div></div>`
        : modelo === 'fixo'
        ? `<div class="hint-box s"><label style="display:block;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:6px">Valor pago neste lançamento (R$)</label><input type="number" min="0" step="0.01" id="lPago" class="input" value="${f.valorPago}" placeholder="${inf.valorFixo ?? '0,00'}"><p style="margin:8px 0 0">Herdado do valor fixo cadastrado (${fmtBRL(inf.valorFixo || 0)}). Ajuste para reajustes pontuais.</p></div>`
        : `<div class="hint-box v"><label style="display:block;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:6px">Valor pago (auto = ${inf.percentualComissao ?? 0}% dos depósitos)</label><input type="number" min="0" step="0.01" id="lPago" class="input" value="${f.valorPago}" placeholder="${fmtBRL((p.totalDep * num(inf.percentualComissao)) / 100)}"><p style="margin:8px 0 0">Calculado automaticamente sobre a soma dos depósitos. Deixe vazio para usar o valor automático, ou informe para revisar.</p></div>`;
      const deps = f.depositos.length
        ? `<div class="dep-list">${f.depositos.map((d, i) => `<div class="dep-item"><input type="number" min="0" step="0.01" class="input dep-inp" data-i="${i}" value="${d}" placeholder="0,00"><button type="button" class="icon-btn del dep-del" data-i="${i}">${svg('trash')}</button></div>`).join('')}</div>`
        : `<p class="muted" style="font-size:12px;margin:0">Nenhum depósito. Adicione se houver.</p>`;
      const notaHoje = hojeLanc
        ? `<div class="hint-box" style="border:1px solid color-mix(in srgb,var(--warning) 30%,transparent);background:var(--warning-soft);display:flex;gap:10px;align-items:flex-start"><span style="color:var(--warning)">${svg('info')}</span><div><b style="color:var(--text)">Já existe um lançamento de hoje para ${esc(inf.nome)}.</b><p style="margin:3px 0 8px">Se esses depósitos são do mesmo dia, adicione-os ao lançamento de hoje em vez de criar outro (evita cobrar o pagamento de novo).</p><button type="button" class="btn soft sm" id="lAbrirHoje">${svg('coins')} Adicionar depósito ao de hoje</button></div></div>`
        : '';
      return `<div class="modal-head"><h2>${ed ? 'Editar lançamento' : 'Novo lançamento'}</h2><p>${esc(inf.nome)} · modelo ${modelo}</p><button class="icon-btn modal-x" id="mX">${svg('close')}</button></div>
      <div class="modal-body">
        ${notaHoje}
        <div class="form-row c3"><div class="field"><label>Data *</label><input type="date" id="lData" class="input" value="${f.data}" max="${hojeISO()}"></div><div class="field"><label>Cadastros gerados</label><input type="number" min="0" id="lCad" class="input" value="${f.cadastros}" placeholder="0"></div><div class="field"><label>Gastos extras (R$)</label><input type="number" min="0" step="0.01" id="lGas" class="input" value="${f.gastosExtras}" placeholder="0,00"></div></div>
        ${espec}
        <div class="box"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><label style="color:var(--text);font-size:13px;font-weight:600;margin:0">Depósitos do dia</label><button type="button" class="btn soft sm" id="lAddDep">${svg('plus')}Outro valor</button></div><p class="muted" style="font-size:12px;margin:0 0 10px">Toque nos valores a cada depósito que cair (ou "Outro valor" para digitar).</p><div class="chip-adds" style="margin-bottom:12px">${presetsDep().map((v) => `<button type="button" class="chip-add l-chip" data-v="${v}">+ R$ ${v}</button>`).join('')}</div>${deps}<p class="muted" style="font-size:12px;margin:10px 0 0">Soma dos depósitos: <b style="color:var(--text)" id="lSoma">${fmtBRL(p.totalDep)}</b></p></div>
        <div class="form-row c3"><div class="field"><label>Receita bruta (R$)</label><input type="number" min="0" step="0.01" id="lBruta" class="input" value="${f.receitaBruta}" placeholder="0,00"><p class="muted" id="lBrutaHint" style="font-size:11px;margin:5px 0 0">${f.receitaBrutaManual ? 'Editada à mão. <button type="button" id="lBrutaAuto" style="background:none;border:none;color:var(--accent);font:inherit;font-size:11px;cursor:pointer;padding:0;text-decoration:underline">usar a soma dos depósitos</button>' : '= soma dos depósitos (edite se a plataforma considerar outro valor)'}</p></div><div class="field"><label>% aplicado (sua fatia)</label><input type="number" min="0" max="100" step="0.1" id="lPct" class="input" value="${f.percentualAplicado}"></div><div class="field"><label>Receita líquida</label><div class="readonly-val" id="lRecLiq" style="color:var(--accent)">${fmtBRL(p.recLiq)}</div></div></div>
        <div class="lucro-preview"><div><div>Lucro do lançamento</div><div class="muted" style="font-size:12px">Receita líquida − valor pago − gastos extras</div></div><div class="big tnum ${p.lucro < 0 ? 'neg' : 'pos'}" id="lLucro">${fmtBRL(p.lucro)}</div></div>
        <div class="field"><label>Observações</label><textarea class="textarea" id="lObs" placeholder="Notas do lançamento…">${esc(f.observacoes)}</textarea></div>
        <div id="lErr"></div>
      </div>
      <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn" id="mSave">${ed ? 'Salvar' : 'Adicionar lançamento'}</button></div>`;
    };

    const readScalars = () => {
      const g = (id) => { const e = document.getElementById(id); return e ? e.value : undefined; };
      f.data = g('lData'); f.cadastros = g('lCad'); f.gastosExtras = g('lGas'); f.receitaBruta = g('lBruta');
      f.percentualAplicado = g('lPct'); f.observacoes = g('lObs') ?? f.observacoes;
      if (g('lQtd') !== undefined) f.quantidadeStories = g('lQtd');
      if (g('lCob') !== undefined) f.valorCobrado = g('lCob');
      if (g('lPago') !== undefined) f.valorPago = g('lPago');
    };
    const updatePreview = () => {
      const p = preview();
      const set = (id, val) => { const e = document.getElementById(id); if (e) e.textContent = val; };
      set('lSoma', fmtBRL(p.totalDep)); set('lRecLiq', fmtBRL(p.recLiq)); set('lCps', p.cps != null ? fmtBRL(p.cps) : '—');
      const lu = document.getElementById('lLucro'); if (lu) { lu.textContent = fmtBRL(p.lucro); lu.className = 'big tnum ' + (p.lucro < 0 ? 'neg' : 'pos'); }
    };
    const rerender = () => { readScalars(); modalRoot.querySelector('.modal').innerHTML = render(); wire(); };
    const addDepRow = () => { readScalars(); f.depositos.push(''); rerender(); const inps = modalRoot.querySelectorAll('.dep-inp'); const last = inps[inps.length - 1]; if (last) last.focus(); };
    const wire = () => {
      document.getElementById('mX').addEventListener('click', closeModal);
      document.getElementById('mCancel').addEventListener('click', closeModal);
      document.getElementById('mSave').addEventListener('click', salvar);
      document.getElementById('lAddDep').addEventListener('click', addDepRow);
      modalRoot.querySelectorAll('.l-chip').forEach((b) => b.addEventListener('click', () => { readScalars(); f.depositos.push(String(round2(num(b.dataset.v)))); syncReceita(); rerender(); }));
      const abrirHoje = document.getElementById('lAbrirHoje');
      if (abrirHoje) abrirHoje.addEventListener('click', () => { closeModal(); openQuickDeposito(inf, hojeLanc); });
      modalRoot.querySelectorAll('.dep-inp').forEach((inp) => {
        inp.addEventListener('input', (e) => { f.depositos[+e.target.dataset.i] = e.target.value; syncReceita(); updatePreview(); });
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); readScalars(); if (f.depositos[f.depositos.length - 1] !== '') addDepRow(); } });
      });
      modalRoot.querySelectorAll('.dep-del').forEach((b) => b.addEventListener('click', () => { readScalars(); f.depositos.splice(+b.dataset.i, 1); syncReceita(); rerender(); }));
      const lBruta = document.getElementById('lBruta');
      if (lBruta) lBruta.addEventListener('input', (e) => {
        f.receitaBrutaManual = e.target.value.trim() !== '';
        if (!f.receitaBrutaManual) syncReceita();
        readScalars(); updatePreview();
        const hint = document.getElementById('lBrutaHint');
        if (hint) hint.innerHTML = f.receitaBrutaManual ? 'Editada à mão. <button type="button" id="lBrutaAuto" style="background:none;border:none;color:var(--accent);font:inherit;font-size:11px;cursor:pointer;padding:0;text-decoration:underline">usar a soma dos depósitos</button>' : '= soma dos depósitos (edite se a plataforma considerar outro valor)';
        wireBrutaAuto();
      });
      wireBrutaAuto();
      ['lPct', 'lGas', 'lCob', 'lQtd', 'lPago'].forEach((id) => { const e = document.getElementById(id); if (e) e.addEventListener('input', () => { readScalars(); updatePreview(); }); });
    };
    const wireBrutaAuto = () => {
      const btn = document.getElementById('lBrutaAuto');
      if (btn) btn.addEventListener('click', () => { f.receitaBrutaManual = false; syncReceita(); readScalars(); rerender(); });
    };
    const salvar = () => {
      readScalars();
      const err = document.getElementById('lErr');
      if (!f.data) { err.innerHTML = `<div class="form-err">A data é obrigatória.</div>`; return; }
      const depositos = f.depositos.map((v) => num(v)).filter((_, i) => f.depositos[i] !== '' && f.depositos[i] != null);
      if (depositos.some((v) => v < 0)) { err.innerHTML = `<div class="form-err">Depósitos não podem ser negativos.</div>`; return; }
      const input = { depositos, receitaBruta: Math.max(0, num(f.receitaBruta)), percentualAplicado: Math.max(0, num(f.percentualAplicado)), gastosExtras: Math.max(0, num(f.gastosExtras)) };
      if (modelo === 'stories') { input.quantidadeStories = Math.max(0, Math.trunc(num(f.quantidadeStories))); input.valorCobrado = Math.max(0, num(f.valorCobrado)); }
      if (modelo === 'fixo' || modelo === 'percentual') input.valorPago = f.valorPago === '' ? null : Math.max(0, num(f.valorPago));
      const c = calcLanc(input, inf);
      const rec = { influenciadorId: inf.id, data: f.data, cadastros: Math.max(0, Math.trunc(num(f.cadastros))), depositos, receitaBruta: c.receitaBruta, receitaBrutaManual: !!f.receitaBrutaManual, percentualAplicado: c.percentualAplicado, receitaLiquida: c.receitaLiquida, gastosExtras: c.gastosExtras, valorPago: c.valorPago, lucro: c.lucro, quantidadeStories: c.quantidadeStories, valorCobrado: c.valorCobrado, observacoes: (f.observacoes || '').trim() || null };
      if (ed) { Object.assign(lanc, rec); } else { db.lancamentos.push({ id: db.seq++, criadoEm: new Date().toISOString(), ...rec }); }
      save(); closeModal(); viewDetalhe(document.getElementById('main'), inf.id);
    };
    openModal(render());
    wire();
  }

  // Recalcula um lançamento após anexar novos depósitos, respeitando o modelo.
  function recalcComDepositos(lanc, inf, novos) {
    const depositos = [...(lanc.depositos || []), ...novos];
    // Se a receita bruta foi definida à mão (flag, ou dado antigo em que ela
    // difere da soma), preserva-a; caso contrário acompanha a soma dos depósitos.
    const manual = lanc.receitaBrutaManual != null
      ? lanc.receitaBrutaManual
      : (lanc.receitaBruta != null && Math.abs((lanc.receitaBruta || 0) - somaDep(lanc.depositos)) > 0.01);
    const receitaBruta = manual ? lanc.receitaBruta : somaDep(depositos);
    const input = { depositos, receitaBruta, percentualAplicado: lanc.percentualAplicado, gastosExtras: lanc.gastosExtras };
    if (inf.modeloPagamento === 'stories') { input.quantidadeStories = lanc.quantidadeStories; input.valorCobrado = lanc.valorCobrado; }
    else if (inf.modeloPagamento === 'fixo') input.valorPago = lanc.valorPago;
    else input.valorPago = null; // percentual: recalcula sobre a nova soma
    const c = calcLanc(input, inf);
    Object.assign(lanc, { depositos, receitaBruta: c.receitaBruta, receitaLiquida: c.receitaLiquida, valorPago: c.valorPago, lucro: c.lucro });
  }

  /* ---- Adição rápida de depósitos (o dinheiro que cai ao longo do dia) ---- */
  function openQuickDeposito(inf, lanc) {
    const num = (v) => (v === '' || v == null ? 0 : Number(v) || 0);
    let novos = [];      // depósitos já tocados/digitados nesta sessão (números)
    let manual = '';     // valor avulso sendo digitado
    const readManual = () => { const e = document.getElementById('qdManual'); if (e) manual = e.value; };
    const commitManual = () => { readManual(); const v = round2(num(manual)); if (v > 0) { novos.push(v); manual = ''; } };

    const render = () => {
      const somaAtual = somaDep(lanc.depositos);
      const somaNovos = round2(novos.reduce((a, v) => a + v, 0));
      const chips = presetsDep().map((v) => `<button type="button" class="chip-add" data-v="${v}">+ R$ ${v}</button>`).join('');
      const listaNovos = novos.length
        ? `<div class="chip-adds" style="margin-top:12px">${novos.map((v, i) => `<span class="dep-chip">${fmtBRL(v)}<button type="button" class="qd-rm" data-i="${i}" aria-label="remover">${svg('close')}</button></span>`).join('')}</div>`
        : `<p class="muted" style="font-size:12px;margin:12px 0 0">Toque nos valores acima a cada depósito que cair. A receita é montada sozinha.</p>`;
      return `<div class="modal-head"><h2>Adicionar depósito</h2><p>${esc(inf.nome)} · lançamento de ${fmtData(lanc.data)}</p><button class="icon-btn modal-x" id="mX">${svg('close')}</button></div>
      <div class="modal-body">
        <div class="box" style="display:flex;justify-content:space-between;align-items:center"><span class="muted" style="font-size:13px">Depósitos já lançados (${(lanc.depositos || []).length})</span><b class="tnum">${fmtBRL(somaAtual)}</b></div>
        <div>
          <label style="color:var(--text);font-size:13px;font-weight:600;display:block;margin-bottom:9px">Toque para adicionar</label>
          <div class="chip-adds">${chips}</div>
          ${listaNovos}
        </div>
        <div class="field"><label>Outro valor</label>
          <div style="display:flex;gap:8px"><input type="number" min="0" step="0.01" id="qdManual" class="input" value="${manual}" placeholder="Ex: 35,50"><button type="button" class="btn soft" id="qdManualAdd">${svg('plus')}Adicionar</button></div>
        </div>
        <div class="lucro-preview"><div><div>Novo total de depósitos</div><div class="muted" style="font-size:12px">${novos.length} novo(s) nesta sessão</div></div><div class="big tnum">${fmtBRL(somaAtual + somaNovos)}</div></div>
        <div id="qdErr"></div>
      </div>
      <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn" id="qdSave">${svg('coins')} Salvar ${novos.length ? novos.length + ' depósito' + (novos.length > 1 ? 's' : '') : ''}</button></div>`;
    };
    const rerender = (focusManual) => { modalRoot.querySelector('.modal').innerHTML = render(); wire(); if (focusManual) { const e = document.getElementById('qdManual'); if (e) { e.focus(); } } };
    const wire = () => {
      document.getElementById('mX').addEventListener('click', closeModal);
      document.getElementById('mCancel').addEventListener('click', closeModal);
      document.getElementById('qdSave').addEventListener('click', salvar);
      modalRoot.querySelectorAll('.chip-add').forEach((b) => b.addEventListener('click', () => { readManual(); novos.push(round2(num(b.dataset.v))); rerender(); }));
      modalRoot.querySelectorAll('.qd-rm').forEach((b) => b.addEventListener('click', () => { readManual(); novos.splice(+b.dataset.i, 1); rerender(); }));
      const mi = document.getElementById('qdManual');
      if (mi) {
        mi.addEventListener('input', (e) => { manual = e.target.value; });
        mi.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); commitManual(); rerender(true); } });
      }
      document.getElementById('qdManualAdd').addEventListener('click', () => { commitManual(); rerender(true); });
    };
    const salvar = () => {
      commitManual();
      const err = document.getElementById('qdErr');
      if (!novos.length) { err.innerHTML = `<div class="form-err">Toque em um valor ou digite um depósito antes de salvar.</div>`; return; }
      recalcComDepositos(lanc, inf, novos);
      save(); closeModal(); viewDetalhe(document.getElementById('main'), inf.id);
    };
    openModal(render());
    wire();
  }

  /* ============================================================
     Tema
  ============================================================ */
  const THEME_KEY = 'controle-igaming-theme';
  function currentTheme() {
    const attr = document.documentElement.getAttribute('data-theme');
    if (attr) return attr;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function applyThemeButton() {
    const t = currentTheme();
    document.getElementById('themeIco').innerHTML = t === 'dark' ? I.sun : I.moon;
    document.getElementById('themeLbl').textContent = t === 'dark' ? 'Modo claro' : 'Modo escuro';
  }
  try { const saved = localStorage.getItem(THEME_KEY); if (saved) document.documentElement.setAttribute('data-theme', saved); } catch (e) {}
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyThemeButton(); router();
  });

  /* ============================================================
     Boot
  ============================================================ */
  window.addEventListener('hashchange', router);
  window.addEventListener('resize', () => { responsiveCharts(); });
  load();
  applyThemeButton();
  if (!location.hash) location.hash = '#/';
  router();
  initCloud();
</script>
